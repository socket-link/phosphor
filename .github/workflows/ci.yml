name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm:
    name: JVM, Lint, Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM and web tests
        run: ./gradlew jvmTest jsTest wasmJsTest

      # The hosted runner image ships the Android SDK and sets ANDROID_HOME.
      - name: Compile Android target
        run: >
          ./gradlew
          :phosphor-core:compileReleaseKotlinAndroid
          :phosphor-lumos:compileReleaseKotlinAndroid
          :phosphor-lumos-compose:compileReleaseKotlinAndroid

      - name: Verify formatting
        run: ./gradlew ktlintCheck

      # gradle.properties opts into Dokka V2, where the V1 `dokkaHtml` task only throws, so
      # this step passed for months without Dokka ever running. Run the task the javadoc
      # jars are built from, which publish.yml also gates on, in every module applying Dokka.
      #
      # pipefail: without it the pipeline's status is tee's, and a failed build passes.
      # --no-build-cache: a task restored from the cache prints no warnings, so a cache hit
      # on inputs that once warned would pass without Dokka running.
      - name: Generate documentation and check for Dokka warnings
        run: |
          set -o pipefail
          ./gradlew --no-build-cache dokkaGeneratePublicationHtml 2>&1 | tee dokka-output.log
          if grep -q "Couldn't resolve link" dokka-output.log; then
            echo "❌ Dokka link resolution warnings found:"
            grep "Couldn't resolve link" dokka-output.log
            exit 1
          fi
          echo "✓ No Dokka link resolution warnings found"

  ios:
    name: iOS Compile And Test
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile iOS device target and run simulator tests
        run: >
          ./gradlew
          :phosphor-core:compileKotlinIosArm64
          :phosphor-lumos:compileKotlinIosArm64
          :phosphor-lumos-compose:compileKotlinIosArm64
          :phosphor-trace:compileKotlinIosArm64
          iosSimulatorArm64Test
